<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Angket PKG – MI Mambaul Ulum</title>
<style>
  :root { --bg:#f5f7fa; --kartu:#fff; --teks:#1f2937; --redup:#6b7280; --garis:#d1d5db; --aksen:#0f766e; --aksen-t:#fff; --err:#b91c1c; --ok:#15803d; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111827; --kartu:#1f2937; --teks:#f3f4f6; --redup:#9ca3af; --garis:#374151; --aksen:#14b8a6; --aksen-t:#04201d; --err:#f87171; --ok:#4ade80; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--teks); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:680px; margin:0 auto; padding:16px 14px 40px; }
  .kartu { background:var(--kartu); border:1px solid var(--garis); border-radius:12px; padding:16px; margin-bottom:14px; }
  h1 { font-size:20px; margin:0 0 4px; } h2 { font-size:16px; margin:0 0 6px; }
  .redup { color:var(--redup); font-size:14px; }
  .butir { padding:12px 0; border-top:1px solid var(--garis); }
  .butir:first-of-type { border-top:0; }
  .butir p { margin:0 0 8px; font-weight:600; }
  .opsi { display:flex; flex-wrap:wrap; gap:8px; }
  .opsi label { flex:1 1 90px; min-width:90px; }
  .opsi input { position:absolute; opacity:0; pointer-events:none; }
  .opsi span { display:block; text-align:center; padding:10px 8px; border:2px solid var(--garis); border-radius:10px; cursor:pointer; font-size:15px; user-select:none; }
  .opsi input:checked + span { border-color:var(--aksen); background:var(--aksen); color:var(--aksen-t); font-weight:700; }
  .opsi input:focus-visible + span { outline:3px solid var(--aksen); outline-offset:2px; }
  .butir.belum { outline:2px solid var(--err); outline-offset:4px; border-radius:6px; }
  select { width:100%; padding:10px; border:2px solid var(--garis); border-radius:10px; background:var(--kartu); color:var(--teks); font-size:16px; }
  button { width:100%; padding:14px; border:0; border-radius:12px; background:var(--aksen); color:var(--aksen-t); font-size:17px; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  button.sekunder { background:transparent; color:var(--aksen); border:2px solid var(--aksen); margin-top:10px; }
  .galat { color:var(--err); font-weight:600; margin:10px 0 0; }
  .sukses { color:var(--ok); font-size:18px; font-weight:700; }
  .baris { display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-top:1px solid var(--garis); font-size:15px; }
  .baris b { text-align:right; }
  .kode { font:700 26px/1.2 ui-monospace,Menlo,Consolas,monospace; letter-spacing:3px; text-align:center; padding:12px; border:2px dashed var(--aksen); border-radius:10px; margin:12px 0; }
  .kop { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
  .kop img { width:56px; height:56px; object-fit:contain; flex:none; }
  .kop b { display:block; font-size:16px; } .kop span { color:var(--redup); font-size:13px; }
  #gambar img { display:block; width:100%; height:auto; margin-top:10px; border:1px solid var(--garis); border-radius:8px; }
  @media print { main > :not(#bukti) { display:none !important; } #bukti button, #bukti #gambar { display:none !important; } body { background:#fff; color:#000; } }
</style>
</head>
<body>
<main id="app"><div class="kartu"><p class="redup">Memuat…</p></div></main>

<script defer src="vendor/firebase-app-compat.js?v=10.12.0"></script>
<script defer src="vendor/firebase-database-compat.js?v=10.12.0"></script>
<script defer src="vendor/firebase-auth-compat.js?v=10.12.0"></script>
<script defer src="js/data-pkg-angket.js?v=5"></script>
<script defer>
(function () {
  'use strict';
  var app = document.getElementById('app');
  var q = new URLSearchParams(location.search), P = q.get('p') || '', G = q.get('g') || '', J = q.get('j') || '', T = q.get('t') || '';

  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) { if (k === 'class') e.className = attrs[k]; else if (k === 'text') e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]); });
    (kids || []).forEach(function (c) { if (c) e.appendChild(c); });
    return e;
  }
  function tampil(judul, teks, galat) {
    app.textContent = '';
    app.appendChild(el('div', { class: 'kartu' }, [el('h1', { text: judul }), el('p', { class: galat ? 'galat' : 'redup', text: teks })]));
  }
  // ----- Bukti pengisian (tanpa isi jawaban): kartu di layar, bisa disimpan sebagai gambar, dicetak, atau kodenya disalin -----
  function waktuId(iso) {
    try { return new Date(iso).toLocaleString('id-ID', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Jakarta' }) + ' WIB'; } catch (e) { return String(iso); }
  }
  function kodeTampil(k) { return String(k).slice(0, 4) + '-' + String(k).slice(4); }
  var LOGO = 'logo/logo-lembaga.png';
  // Gambar bukti dibuat setelah logo selesai dimuat; bila logo gagal dimuat, gambar tetap dibuat tanpa logo (tombol simpan tidak boleh macet).
  function gambarBukti(b, selesai) {
    var im = new Image(), sudah = false;
    function lanjut(ada) { if (sudah) return; sudah = true; var url; try { url = gambarBuktiJadi(b, ada ? im : null); } catch (e) { return selesai(null); } selesai(url); }
    im.onload = function () { lanjut(true); }; im.onerror = function () { lanjut(false); };
    setTimeout(function () { lanjut(false); }, 4000);
    im.src = LOGO;
  }
  function gambarBuktiJadi(b, logo) {
    var c = document.createElement('canvas'), W = 720, H = 400, x = c.getContext('2d');
    c.width = W; c.height = H;
    x.fillStyle = '#ffffff'; x.fillRect(0, 0, W, H);
    x.strokeStyle = '#0f766e'; x.lineWidth = 6; x.strokeRect(3, 3, W - 6, H - 6);
    function muat(t, lebar) { t = String(t); while (t.length > 1 && x.measureText(t).width > lebar) t = t.slice(0, -2) + '\u2026'; return t; }
    var kiri = 36;
    if (logo) { var sk = Math.min(72 / (logo.naturalWidth || 72), 72 / (logo.naturalHeight || 72)), lw = (logo.naturalWidth || 72) * sk, lh = (logo.naturalHeight || 72) * sk; x.drawImage(logo, 36, 26 + (72 - lh) / 2, lw, lh); kiri = 36 + 72 + 16; }
    x.fillStyle = '#0f766e'; x.font = 'bold 30px sans-serif'; x.fillText('BUKTI PENGISIAN ANGKET PKG', kiri, 66);
    x.fillStyle = '#111827'; x.font = '22px sans-serif'; x.fillText('MI Mambaul Ulum', kiri, 102);
    var baris = [['Angket', b.judul], ['Untuk', b.nama], ['Dikirim', waktuId(b.at)]], y = 156;
    baris.forEach(function (r) {
      x.fillStyle = '#6b7280'; x.font = '20px sans-serif'; x.fillText(r[0], 36, y);
      x.fillStyle = '#111827'; x.font = 'bold 20px sans-serif'; x.fillText(muat(r[1], W - 190), 160, y); y += 42;
    });
    x.fillStyle = '#111827'; x.font = 'bold 20px sans-serif'; x.fillText('Kode bukti', 36, y + 16);
    x.strokeStyle = '#0f766e'; x.lineWidth = 3; x.setLineDash([8, 6]); x.strokeRect(160, y - 14, 330, 56); x.setLineDash([]);
    x.fillStyle = '#0f766e'; x.font = 'bold 34px monospace'; x.fillText(kodeTampil(b.kode), 178, y + 26);
    x.fillStyle = '#6b7280'; x.font = '16px sans-serif'; x.fillText('Jawaban bersifat rahasia. Kode ini bukan isi jawaban.', 36, H - 30);
    return c.toDataURL('image/png');
  }
  function buktiKartu(b, lagi) {
    app.textContent = '';
    var logoImg = el('img', { src: LOGO, alt: 'Logo MI Mambaul Ulum' });
    logoImg.addEventListener('error', function () { logoImg.style.display = 'none'; });
    var wadah = el('div', { class: 'kartu', id: 'bukti' }, [
      el('div', { class: 'kop' }, [logoImg, el('div', {}, [el('b', { text: 'MI Mambaul Ulum' }), el('span', { text: 'Bukti pengisian angket PKG' })])]),
      el('p', { class: 'sukses', text: '\u2714 Terima kasih, jawaban sudah terkirim.' }),
      el('p', { class: 'redup', text: 'Simpan bukti ini bila madrasah memintanya. Madrasah hanya mencatat bahwa tautan ini sudah dipakai; isi jawaban tidak ikut tercantum dan tidak ditampilkan per orang.' }),
      el('div', { class: 'baris' }, [el('span', { class: 'redup', text: 'Angket' }), el('b', { text: b.judul })]),
      el('div', { class: 'baris' }, [el('span', { class: 'redup', text: 'Untuk' }), el('b', { text: b.nama })]),
      el('div', { class: 'baris' }, [el('span', { class: 'redup', text: 'Dikirim' }), el('b', { text: waktuId(b.at) })]),
      el('div', { class: 'kode', text: kodeTampil(b.kode), 'aria-label': 'Kode bukti' })
    ]);
    var info = el('p', { class: 'redup', text: '' });
    var gbr = el('div', { id: 'gambar' });
    var simpan = el('button', { type: 'button', text: '\ud83d\udcbe Simpan bukti sebagai gambar' });
    simpan.addEventListener('click', function () {
      simpan.disabled = true;
      gambarBukti(b, function (url) {
        simpan.disabled = false;
        if (!url) { info.textContent = 'Gambar tidak bisa dibuat di perangkat ini. Silakan catat kode di atas.'; return; }
        gbr.textContent = ''; gbr.appendChild(el('img', { src: url, alt: 'Bukti pengisian angket' }));
        info.textContent = 'Bila gambar tidak otomatis terunduh, tekan lama pada gambar lalu pilih Simpan.';
        siapBagikan(url, b);
        try { var a = document.createElement('a'); a.href = url; a.download = 'bukti-angket-' + b.kode + '.png'; document.body.appendChild(a); a.click(); a.remove(); } catch (e) { }
      });
    });
    // Bagikan lewat lembar bagikan perangkat (HP): pilih WhatsApp lalu Status. Tombol baru muncul setelah gambar jadi, agar klik berasal dari sentuhan pengguna.
    function siapBagikan(url, bb) {
      if (!navigator.share || !navigator.canShare || document.getElementById('bagikanBukti')) return;
      fetch(url).then(function (r) { return r.blob(); }).then(function (blob) {
        var f = new File([blob], 'bukti-angket-' + bb.kode + '.png', { type: 'image/png' });
        if (!navigator.canShare({ files: [f] })) return;
        var tb = el('button', { type: 'button', id: 'bagikanBukti', text: '\ud83d\udce4 Bagikan ke WhatsApp (untuk status)' });
        tb.addEventListener('click', function () {
          navigator.share({ files: [f], title: 'Bukti pengisian angket PKG' }).catch(function (e) { if (e && e.name !== 'AbortError') info.textContent = 'Tidak bisa membagikan dari perangkat ini. Simpan gambarnya lalu unggah manual di status WhatsApp.'; });
        });
        gbr.insertBefore(tb, gbr.firstChild);
        info.textContent = 'Pilih WhatsApp lalu \u201cStatus\u201d (nama pilihan bisa berbeda tiap versi WhatsApp).';
      }).catch(function () { });
    }
    var cetak = el('button', { type: 'button', class: 'sekunder', text: '\ud83d\udda8\ufe0f Cetak / simpan PDF' });
    cetak.addEventListener('click', function () { window.print(); });
    var salin = el('button', { type: 'button', class: 'sekunder', text: '\ud83d\udccb Salin kode' });
    salin.addEventListener('click', function () {
      var t = kodeTampil(b.kode);
      try { navigator.clipboard.writeText(t).then(function () { info.textContent = 'Kode ' + t + ' disalin.'; }, function () { info.textContent = 'Catat kode: ' + t; }); } catch (e) { info.textContent = 'Catat kode: ' + t; }
    });
    [simpan, cetak, salin, info, gbr].forEach(function (n) { wadah.appendChild(n); });
    app.appendChild(wadah);
    if (lagi) app.appendChild(lagi);
  }
  function mulai() {
    var A = window.PKG_ANGKET, def = A && A.jenis[J];
    if (!P || !G || !def || !/^[A-Za-z0-9_\-]+$/.test(P) || !/^[A-Za-z0-9_\-]+$/.test(G)) return tampil('Tautan tidak valid', 'Mohon minta tautan angket yang benar kepada madrasah.', true);
    if (typeof firebase === 'undefined') return tampil('Tidak dapat memuat', 'Periksa koneksi internet lalu muat ulang halaman ini.', true);
    firebase.initializeApp({
      apiKey: 'AIzaSyDavQuImJuJmskAbcqeFL3rkxFaKVFS4HI',
      authDomain: 'administrasi-madrasah-46c72.firebaseapp.com',
      databaseURL: 'https://administrasi-madrasah-46c72-default-rtdb.firebaseio.com',
      projectId: 'administrasi-madrasah-46c72',
      appId: '1:515893476502:web:7141669c4158a4678c16b7'
    });
    var db = firebase.database();
    firebase.auth().signInAnonymously().then(function () {
      return db.ref('pkg_v4_angket_info/' + P + '/' + G).once('value');
    }).then(function (s) {
      var info = s.val();
      if (!info || info.aktif !== true) return tampil('Angket belum dibuka', 'Angket ini belum dibuka atau sudah ditutup oleh madrasah.', true);
      info.kupon = info.mode === 'kupon';
      if (info.kupon) {                                       // tautan sekali pakai: wajib membawa token milik responden
        if (!/^[A-Za-z0-9]{20,40}$/.test(T)) return tampil('Tautan tidak lengkap', 'Angket ini memakai tautan pribadi sekali pakai. Mohon minta tautan Anda sendiri kepada madrasah.', true);
        var sudah = false; try { sudah = localStorage.getItem('pkgAngket_' + T) === '1'; } catch (e) { }
        if (sudah) {
          var tersimpan = null; try { tersimpan = JSON.parse(localStorage.getItem('pkgBukti_' + T) || 'null'); } catch (e) { }
          if (tersimpan && tersimpan.kode && tersimpan.at) return buktiKartu(tersimpan, null);   // tampilkan lagi bukti yang pernah dibuat di perangkat ini
          return tampil('Jawaban sudah terkirim', 'Tautan ini sudah dipakai di perangkat ini. Terima kasih.', false);
        }
      }
      formulir(db, def, info);
    }).catch(function (e) {
      tampil('Tidak dapat memuat', 'Periksa koneksi internet lalu coba lagi. (' + ((e && (e.code || e.message)) || 'galat') + ')', true);
    });
  }

  function formulir(db, def, info) {
    var A = window.PKG_ANGKET, jawab = {}, kelas = '';
    app.textContent = '';
    app.appendChild(el('div', { class: 'kartu' }, [
      el('h1', { text: def.judul }),
      el('p', { text: 'Untuk: ' + (info.nama || 'guru') }),
      el('p', { class: 'redup', text: def.pembuka })
    ]));
    var kartu = el('div', { class: 'kartu' }), form = el('div', {});
    kartu.appendChild(form); app.appendChild(kartu);

    if (J === 'siswa') {
      var sel = el('select', { 'aria-label': 'Kelas' }, ['', '4', '5', '6', 'Lainnya'].map(function (k) { return el('option', { value: k, text: k ? 'Kelas ' + k : 'Kelas (boleh dikosongkan)' }); }));
      if (sel.options[4]) sel.options[4].textContent = 'Kelas lainnya';
      sel.addEventListener('change', function () { kelas = sel.value; });
      form.appendChild(el('div', { class: 'butir' }, [sel]));
    }
    var daftar = def.butir;                                   // butir pembanding ikut ditanyakan
    daftar.forEach(function (x, i) {
      var box = el('div', { class: 'butir', 'data-k': x.k }), grup = el('div', { class: 'opsi', role: 'radiogroup', 'aria-label': x.t });
      box.appendChild(el('p', { text: (i + 1) + '. ' + x.t }));
      ['y', 'k', 't'].concat(x.x ? ['x'] : []).forEach(function (kode) {
        var id = 'r_' + x.k + '_' + kode, inp = el('input', { type: 'radio', name: 'n_' + x.k, id: id, value: kode });
        inp.addEventListener('change', function () { jawab[x.k] = kode; box.classList.remove('belum'); });
        grup.appendChild(el('label', { 'for': id }, [inp, el('span', { text: A.pilihan[kode] })]));
      });
      box.appendChild(grup); form.appendChild(box);
    });
    var galat = el('p', { class: 'galat', role: 'alert' }), kirim = el('button', { type: 'button', text: 'Kirim jawaban' });
    kartu.appendChild(galat); kartu.appendChild(kirim);

    kirim.addEventListener('click', function () {
      var kosong = daftar.filter(function (x) { return !jawab[x.k]; });
      Array.prototype.forEach.call(form.querySelectorAll('.butir[data-k]'), function (b) { b.classList.toggle('belum', kosong.some(function (x) { return x.k === b.getAttribute('data-k'); })); });
      if (kosong.length) { galat.textContent = 'Masih ada ' + kosong.length + ' pernyataan yang belum dijawab.'; var f = form.querySelector('.belum'); if (f) f.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
      galat.textContent = ''; kirim.disabled = true; kirim.textContent = 'Mengirim…';
      var rec = { j: jawab, at: new Date().toISOString() }; if (kelas) rec.kls = kelas;
      var ref = info.kupon ? db.ref('pkg_v4_angket/' + P + '/' + G + '/' + J + '/' + T) : db.ref('pkg_v4_angket/' + P + '/' + G + '/' + J).push();
      ref.set(rec).then(function () {
        if (info.kupon) { try { localStorage.setItem('pkgAngket_' + T, '1'); } catch (e) { } }
        // bukti: kode = 8 karakter pertama tautan sekali pakai (mode terbuka: 8 karakter terakhir id jawaban); isi jawaban tidak ikut
        var kunciBukti = info.kupon ? T : String(ref.key || ''), b = { kode: info.kupon ? kunciBukti.slice(0, 8) : kunciBukti.slice(-8), at: rec.at, judul: def.judul, nama: info.nama || 'guru' };
        if (info.kupon) { try { localStorage.setItem('pkgBukti_' + T, JSON.stringify(b)); } catch (e) { } }
        var lagi = null;
        if (!info.kupon) {                                    // tautan terbuka (warisan): boleh isi lagi; tautan sekali pakai tidak
          lagi = el('button', { type: 'button', class: 'sekunder', text: 'Isi untuk responden lain' });
          lagi.addEventListener('click', function () { formulir(db, def, info); window.scrollTo(0, 0); });
        }
        buktiKartu(b, lagi); window.scrollTo(0, 0);
      }).catch(function (e) {
        kirim.disabled = false; kirim.textContent = 'Kirim jawaban';
        galat.textContent = (e && e.code === 'PERMISSION_DENIED') ? (info.kupon ? 'Tautan ini sudah dipakai, tidak berlaku, atau angket sudah ditutup.' : 'Angket sudah ditutup oleh madrasah.') : 'Gagal mengirim. Periksa koneksi lalu coba lagi.';
      });
    });
  }

  if (document.readyState === 'complete') mulai(); else window.addEventListener('load', mulai);
})();
</script>
</body>
</html>
