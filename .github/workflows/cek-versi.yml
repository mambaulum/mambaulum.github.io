name: Cek versi aset
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Periksa versi aset
        run: node cek-versi.js
      - name: Simpan foto versi
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          node cek-versi.js --simpan
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .cek-versi.json
          git diff --cached --quiet || git commit -m "Perbarui .cek-versi.json"
          git push
